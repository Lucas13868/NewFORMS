<!DOCTYPE html>

<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
        <title>NewForms: Login</title>
    </head>
    <body>
        <div class="container">
            <h1 class="text-center my-5">NewFORMS</h1>
            <form action="{{ url_for('login') }}" method="post">
                <div class="mb-3">
                    <input class="form-control w-auto mx-auto" type="email" autocomplete="on" placeholder="user@email.com" name="email" id="login_email"> 
                </div>
                <div class="mb-3">
                    <input class="form-control w-auto mx-auto" type="password" placeholder="Password" name="password"> 
                </div>
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    <div class="text-center text-danger mb-2">{{ messages[0] }}</div>
                    {% endif %}
                {% endwith %}
                <div class="mb-3 d-flex justify-content-center">
                    <button class="btn btn-primary w-auto mx-auto" type="submit">Login</button>
                </div>
            </form>
            <div class="text-center">
                Don't have an account? 
                <a href="{{ url_for('register') }}">Register</a> 
                now!
            </div>
        </div>
    </body>
</html>
